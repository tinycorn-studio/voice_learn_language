name = "voice-chat-learn-language-worker"
main = "src/entry.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
DATA_BACKEND = "gas"
SHEET_MIRROR_ENABLED = "false"
GEMINI_MODEL = "models/gemini-3.8-live"
ALLOWED_ORIGIN = "https://voice-chat-learn-language.pages.dev"

# First attempt 08:00 +07, then minute ticks through 08:05 for bounded retries/recovery.
[triggers]
crons = ["0-5 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "voice-learn-staging-db"
database_id = "a8306e2e-f3ee-4e43-a6c1-07739dfffc26"
migrations_dir = "migrations"

