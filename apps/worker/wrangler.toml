name = "voice-chat-learn-language-worker"
main = "src/entry.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
DATA_BACKEND = "gas"
GEMINI_MODEL = "models/gemini-3.8-live"
ALLOWED_ORIGIN = "https://voice-chat-learn-language.pages.dev"

# First attempt 08:00 +07, then minute ticks through 08:05 for bounded retries/recovery.
[triggers]
crons = ["0-5 1 * * *"]
