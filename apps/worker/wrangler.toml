name = "voice-chat-learn-language-worker"
main = "src/entry.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
DATA_BACKEND = "d1"
SHEET_MIRROR_ENABLED = "true"
SHEET_MIRROR_EPOCH = "prod_cutover_01"
GEMINI_MODEL = "models/gemini-3.8-live"
ALLOWED_ORIGIN = "https://voice-chat-learn-language.pages.dev"

# Background delivery/mirror every minute; handler limits daily digest to 08:00–08:05 +07.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "voice-learn-prod-db"
database_id = "95af3a2e-7f67-4b7a-b075-44fa2c0c1da4"
migrations_dir = "migrations"

